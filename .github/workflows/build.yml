name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # A fixed signing key means new builds install as updates over old ones.
      # The key lives encrypted in signing/; the KEYSTORE_PASSWORD secret unlocks it.
      - name: Unlock signing key
        if: env.KEYSTORE_PASSWORD != ''
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:KEYSTORE_PASSWORD
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"

      - name: Note test key
        if: env.KEYSTORE_PASSWORD == ''
        run: echo "SIGNED_WITH=test key" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEY_ALIAS: drivedeck
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk DriveDeck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DriveDeck
          path: DriveDeck.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DriveDeck.apk \
            --title "DriveDeck build ${{ github.run_number }} (${{ env.SIGNED_WITH }})" \
            --notes "Open this page on the TBox and tap DriveDeck.apk to install or update."
