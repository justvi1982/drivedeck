<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #p { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="p"></div>
<script>
  // Plays one YouTube video. When playing along, sync() keeps it in step with the front.
  var player = null, ready = false, pending = null;
  var lastSeek = 0, checkAt = 0, bias = 0;

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('p', {
      width: '100%', height: '100%', videoId: '__VIDEO__',
      playerVars: {
        autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1,
        iv_load_policy: 3, start: __START__, origin: '__ORIGIN__'
      },
      events: {
        onReady: function () {
          ready = true;
          try { player.unMute(); player.setVolume(100); player.playVideo(); } catch (e) {}
          Android.onReady();
          if (pending) { sync(pending[0], pending[1]); pending = null; }
        },
        onError: function (e) { Android.onError(e.data); },
        onStateChange: function (e) { Android.onState(e.data); }
      }
    });
  }

  // Small differences: run a touch faster or slower until in step (smooth, no jumps).
  // Big differences: jump, and learn how far jumps land off. Some players can't change speed
  // in small steps; then only jumps are used.
  var rateOk = true, rate = 1;
  function setRate(r) {
    if (!rateOk || r === rate) return;
    try {
      player.setPlaybackRate(r);
      if (Math.abs(player.getPlaybackRate() - r) > 0.01) { rateOk = false; player.setPlaybackRate(1); rate = 1; return; }
      rate = r;
    } catch (e) { rateOk = false; }
  }

  // pos: where the front's picture should be now (ms, already allowing for the car's sound delay).
  function sync(pos, playing) {
    if (!ready) { pending = [pos, playing]; return; }
    var state = player.getPlayerState();   // 1 playing, 2 paused, 3 buffering, 0 ended
    var now = Date.now();
    var diff = player.getCurrentTime() * 1000 - pos;   // > 0: we're ahead
    if (playing && state === 1) {
      if (checkAt && now > checkAt) {
        bias = Math.max(-2000, Math.min(2000, bias - diff * 0.7));
        checkAt = 0;
      }
      if (Math.abs(diff) > 800 || (!rateOk && Math.abs(diff) > 200)) {
        if (now - lastSeek > 3000) {
          setRate(1);
          player.seekTo((pos + bias) / 1000, true);
          lastSeek = now; checkAt = now + 2500;
        }
      } else if (Math.abs(diff) > 40) {
        setRate(diff > 0 ? 0.95 : 1.05);
      } else {
        setRate(1);
      }
    } else if (!playing) {
      setRate(1);
      if (Math.abs(diff) > 300 && now - lastSeek > 1000) { player.seekTo(pos / 1000, true); lastSeek = now; }
    }
    if (playing && state !== 1 && state !== 3) player.playVideo();
    if (!playing && (state === 1 || state === 3)) player.pauseVideo();
  }
</script>
</body>
</html>
